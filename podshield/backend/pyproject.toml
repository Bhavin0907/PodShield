[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podshield"
version = "0.1.0"
description = "Container image security and hygiene auditor for Podman on RHEL"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "sqlmodel>=0.0.16",
    "podman>=5.0",
    "defusedxml>=0.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "bandit>=1.7",
    "psutil>=5.9",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-defusedxml>=0.7",
]

[project.scripts]
podshield = "podshield.cli:main"

[tool.setuptools.packages.find]
include = ["podshield*"]

[tool.setuptools.package-data]
podshield = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast tests with no Podman, no network and no external tools (the default)",
    "integration: needs a real Podman (run on the RHEL VM); skipped when it is missing",
    "requires_root: needs root (rootful Podman, image mounts)",
    "requires_oscap: needs oscap-podman and the OVAL feed",
    "requires_trivy: needs trivy",
    "requires_network: needs outbound network access (image pulls)",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
source = ["podshield"]
branch = false

[tool.coverage.report]
# main.py is process wiring (uvicorn entry point); it is covered by test_main.py but is not
# part of the coverage target.
omit = ["podshield/main.py"]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.bandit]
# B404/B603: every subprocess call takes an argument list (never a shell) and a timeout. That is not
# a convention: tests/test_t5_robustness.py audits it with the AST on every run.
skips = ["B404", "B603"]
